name: protection_ledger
version: "1.0.0"
config-version: 2
profile: protection_ledger

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  horizon_start: "2024-01-01"
  horizon_end: "2025-12-31"
  incremental_lookback_hours: 72   # late-arriving claim statuses and cancellations are re-read
  in_flight_hours: 24              # unmatched ledger/payment rows younger than this are timing, not breaks
  max_source_lag_hours: 48         # a feed this far behind the freshest feed has stalled
  free_look_days: 30

models:
  protection_ledger:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

data_tests:
  protection_ledger:
    +severity: error
