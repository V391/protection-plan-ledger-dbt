name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Generate, two batch incremental build, compare to full refresh, answer key,
      # docs gate and the injected defect suite. Any failure blocks the merge.
      - run: python run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
